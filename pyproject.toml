[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quoty-flow"
version = "0.1.0"
description = "Quoty flow using dagster"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "JieShuang", email = "jshuangzl@gmail.com" }]
dependencies = [
    "dagster",
    "dagster-cloud",
    "boto3",
    "dagster-airbyte",
    "dagster-dbt",
    "dagster-postgres",
    "pandas",
    "numpy",
    "scipy",
    "dbt-core",
    "dbt-postgres",
    "packaging",
    "dagster-deltalake",
    "dagster-deltalake-pandas",
    "dagster-aws",
    "pydantic",
    "yfinance",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = ["dagster-webserver", "pytest", "pytest-cov", "jupyterlab", "yfinance"]
test = ["dbt-postgres<1.8.0", "pytest-cov"]

[tool.setuptools]
packages = ["src.quoty_flow"]
package-data = { "quoty_flow" = ["dbt_project/**/*"] }

[tool.dagster]
code_location_name = "src.quoty_flow"      # 代码库名称
module_name = "src.quoty_flow.definitions" # 入口模块


[tool.pytest.ini_options]
testpaths = ["quoty_flow_tests"]
python_files = ["test_*.py"]
addopts = "-v"


[tool.ruff]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
